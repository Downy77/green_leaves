services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green_leaves_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "false"
      CHAT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/green_leaves
      KNOWLEDGE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/green_leaves
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MODELS: ${OPENAI_MODELS:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_MODELS: ${DEEPSEEK_MODELS:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: green_leaves_postgres
    environment:
      POSTGRES_DB: green_leaves
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d green_leaves"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
