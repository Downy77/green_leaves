[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coupling-life-clone"
version = "1.2.0"
description = "A modular local-first AI workspace built with FastAPI, LangGraph and LangChain"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "openai>=1.40.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-tavily>=0.2.0",
]

[project.scripts]
coupling-life-clone = "main:run"
